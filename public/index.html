<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meccabrain Lab Dashboard</title>
  <style>
    body { font-family: system-ui, Arial; margin: 0; padding: 0; background:#0b0b0f; color:#e6eef8; }
    header { padding: 12px 16px; background:#0f1724; border-bottom:1px solid #111827; }
    #logs { padding: 12px; height: calc(100vh - 56px); overflow:auto; }
    .entry { margin-bottom:8px; font-size:13px; }
    .ts { color:#94a3b8; margin-right:8px; }
    .type { color:#60a5fa; margin-right:8px; }
    .msg { color:#e6eef8; }
  </style>
</head>
<body>
  <header><strong>Meccabrain Lab Dashboard</strong> — live logs</header>
  <div id="logs"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const logs = document.getElementById('logs');
    function add(entry){
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = '<span class="ts">['+entry.ts+']</span>' +
                     '<span class="type">'+(entry.type||'tool')+'</span>' +
                     '<span class="msg">'+(entry.msg||JSON.stringify(entry.data||entry))+'</span>';
      logs.appendChild(el);
      logs.scrollTop = logs.scrollHeight;
    }
    socket.on('log', add);
  </script>
</body>
</html>
